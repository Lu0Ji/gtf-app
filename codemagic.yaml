workflows:
  ios-testflight:
    name: GTF · iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: gtf_app_store_connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gtf.app
      vars:
        # Capacitor 8 wires its plugins through Swift Package Manager
        # (ios/App/CapApp-SPM, regenerated by `cap sync`) — there is no
        # Podfile and no .xcworkspace, so everything targets the .xcodeproj.
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Set build number
        # TestFlight refuses a second upload with the same CFBundleVersion;
        # Codemagic's BUILD_NUMBER goes up by one per run of this workflow,
        # so each push to main lands as a new, installable build.
        script: |
          cd ios/App && agvtool new-version -all "$BUILD_NUMBER"
      - name: Set up automatic code signing
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - aliyusufbusiness1@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
