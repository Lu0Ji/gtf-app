<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: on native iOS the WebView runs edge-to-edge, and
         this is what makes env(safe-area-inset-*) report the real status
         bar / home indicator insets (see src/index.css). No effect elsewhere. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Installable from a phone browser ("Add to Home Screen") — the bridge
         for iPhone users until the TestFlight build exists. The native shells
         ignore all of this. Colors match --color-background / --color-primary
         in src/index.css for each scheme. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-1024.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6fafd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1a22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GTF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap"
      rel="stylesheet"
    />
    <title>GTF · Guess the Future</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
