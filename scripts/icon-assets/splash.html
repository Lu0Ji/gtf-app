<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  #canvas {
    width: 2732px;
    height: 2732px;
    background: #f6fafd;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #badge {
    width: 420px;
    height: 420px;
    border-radius: 90px;
    background: #356a8a;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 60px rgba(23, 43, 58, 0.18);
  }
  #mark {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 800;
    font-size: 150px;
    line-height: 1;
    letter-spacing: -6px;
    color: #ffffff;
    transform: translateY(-9px);
  }
</style>
</head>
<body>
<div id="canvas"><div id="badge"><span id="mark">GTF</span></div></div>
</body>
</html>
